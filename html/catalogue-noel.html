<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1300px 760px at 50% -12%, #44688A 0%, transparent 62%),linear-gradient(180deg,#2C465E 0%, #1B2C3B 100%);
  font-family:Poppins,system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:18px 16px 96px;
}
.topbar{width:100%;max-width:1180px;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:16px;color:#EAF2F8}
.topbar .marque{font-family:Playfair Display,serif;font-size:19px;letter-spacing:.14em;text-transform:lowercase}
.topbar .sous{font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:#A9C3D6}

/* le livre : une page = 986 x 1400 */
.book{position:relative;filter:drop-shadow(0 18px 30px rgba(5,15,25,.35));width:min(1180px,100%,calc((100vh - 150px) * 1.4086));aspect-ratio:1972/1400;perspective:2800px;margin:0 auto}
.book .dos-centre{position:absolute;left:50%;top:0;bottom:0;width:24px;transform:translateX(-50%);
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.18) 42%,rgba(0,0,0,.26) 50%,rgba(0,0,0,.18) 58%,rgba(0,0,0,0) 100%);
  z-index:999;pointer-events:none}
.leaf{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;
  transition:transform .95s cubic-bezier(.3,.05,.2,1);cursor:pointer}
.leaf.flip{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:#F7F5F0;
  box-shadow:0 2px 6px rgba(10,20,30,.18)}
.face.recto{border-radius:0 6px 6px 0}
.face.verso{transform:rotateY(180deg);border-radius:6px 0 0 6px}
.face img{display:block;width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.zone{position:absolute;z-index:3;display:block;border-radius:6px;cursor:pointer;transition:box-shadow .2s,background .2s}
.zone:hover{box-shadow:inset 0 0 0 2px rgba(201,162,92,.85);background:rgba(255,255,255,.06)}
.leaf.flip .face.recto a,.leaf.flip .face.recto button,.leaf.flip .face.recto .actions,.leaf.flip .face.recto .fige,.leaf.flip .face.recto .voeu,.leaf.flip .face.recto video,.leaf:not(.flip) .face.verso a,.leaf:not(.flip) .face.verso button,.leaf:not(.flip) .face.verso .actions,.leaf:not(.flip) .face.verso .fige,.leaf:not(.flip) .face.verso .voeu,.leaf:not(.flip) .face.verso video{visibility:hidden;pointer-events:none}
.zone-bouton{position:absolute;z-index:3;left:50%;bottom:3.2%;transform:translateX(-50%);white-space:nowrap;
  font-family:Poppins,sans-serif;font-size:clamp(9px,1.05vw,12px);letter-spacing:.08em;color:#fff;text-decoration:none;
  background:rgba(27,44,59,.78);border:1px solid rgba(230,203,146,.7);padding:.6em 1.3em;border-radius:999px;backdrop-filter:blur(3px);transition:background .2s}
.zone-bouton:hover{background:rgba(160,120,60,.9)}
.face.recto::after{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,rgba(0,0,0,.10),transparent);pointer-events:none}
.face.verso::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(270deg,rgba(0,0,0,.10),transparent);pointer-events:none}

.nav{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:11px 16px;background:linear-gradient(180deg,rgba(27,44,59,0) 0%,rgba(27,44,59,.93) 45%);z-index:1000}
.nav button{appearance:none;border:1px solid rgba(230,203,146,.5);background:rgba(255,255,255,.05);color:#F1EAD9;
  font-family:Poppins,sans-serif;font-size:12px;letter-spacing:.06em;padding:9px 18px;border-radius:999px;cursor:pointer;transition:.18s}
.nav button:hover:not(:disabled){background:rgba(230,203,146,.2)}
.nav button:disabled{opacity:.3;cursor:default}
.nav .pos{color:#CFC2A2;font-size:11.5px;letter-spacing:.14em;min-width:110px;text-align:center}

/* téléphone : une page à la fois, on fait glisser du doigt */
.mob{display:none}
@media (max-width:900px){
  body{padding:14px 0 80px}
  .book,.topbar{display:none}
  .mob{display:block;width:100vw;max-width:100vw;overflow:hidden}
  .mob-tete{color:#E9E4DA;text-align:center;margin:0 0 12px;font-family:Playfair Display,serif;font-size:17px;letter-spacing:.1em}
  .piste{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:12px;padding:0 14px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .piste::-webkit-scrollbar{display:none}
  .carte{flex:0 0 calc(100vw - 40px);width:calc(100vw - 40px);scroll-snap-align:center;aspect-ratio:986/1400;border-radius:8px;overflow:hidden;box-shadow:0 14px 40px rgba(0,0,0,.35);background:#F7F5F0}
  .carte img{display:block;width:100%;height:100%;object-fit:cover}
  .carte{position:relative}
  .nav{gap:8px}.nav button{padding:9px 14px}.nav .lg{display:none}
}

/* --- interactif --- */
#neige{position:fixed;inset:0;pointer-events:none;z-index:0}
.topbar,.book,.mob{position:relative;z-index:1}
.topbar .outils{display:flex;gap:8px;margin-left:auto}
.topbar{flex-wrap:wrap}
.pastille{appearance:none;border:1px solid rgba(230,203,146,.5);background:rgba(255,255,255,.06);color:#F1EAD9;font-family:Poppins,sans-serif;font-size:12px;letter-spacing:.05em;padding:7px 14px;border-radius:999px;cursor:pointer;transition:.18s}
.pastille:hover{background:rgba(230,203,146,.2)}
.pastille b{display:inline-block;min-width:18px;margin-left:4px;padding:1px 6px;border-radius:999px;background:rgba(230,203,146,.25);font-weight:500}
.pastille.or{background:#B88A35;border-color:#D8B36A;color:#fff}
.pastille.or:hover{background:#9A7024}
.pastille.off{opacity:.55}
.fige{position:absolute;z-index:1;pointer-events:none;-webkit-mask-image:radial-gradient(ellipse at center,#000 72%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 72%,transparent 100%)}
.film{position:absolute;object-fit:cover;display:block;pointer-events:none}
.zone .alt{position:absolute;overflow:hidden;opacity:0;transition:opacity .45s ease;border-radius:2px;pointer-events:none}
.zone .alt img{width:100%;height:100%;object-fit:cover;display:block}
.zone:hover .alt{opacity:1}
.zone .eclat{position:absolute;inset:0;pointer-events:none;opacity:0;background:
 radial-gradient(circle at 18% 22%,rgba(255,240,200,.95) 0 1.5px,transparent 2.5px),radial-gradient(circle at 78% 30%,rgba(255,255,255,.95) 0 1.2px,transparent 2.2px),
 radial-gradient(circle at 60% 75%,rgba(255,236,190,.9) 0 1.4px,transparent 2.4px),radial-gradient(circle at 30% 62%,rgba(255,255,255,.9) 0 1px,transparent 2px),
 radial-gradient(circle at 88% 80%,rgba(255,240,200,.9) 0 1.2px,transparent 2.2px)}

.coeur{position:absolute;z-index:4;width:28px;height:28px;border-radius:50%;border:none;background:rgba(255,255,255,.85);color:#B88A35;font-size:16px;line-height:28px;padding:0;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15);opacity:.85;transition:opacity .2s,transform .2s}

.coeur.on{color:#C0392B}
@media (max-width:900px){.coeur{opacity:1;width:26px;height:26px;line-height:26px;font-size:14px}.topbar{display:flex!important;padding:0 14px;margin-bottom:10px}.topbar .marque,.topbar .sous{display:none}.topbar .outils{margin:0 auto}}
.voile{position:fixed;inset:0;z-index:2000;background:rgba(12,22,32,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
.voile.vu{display:flex;animation:apparait .25s ease}
@keyframes apparait{from{opacity:0}to{opacity:1}}
.fiche{position:relative;background:#FBF9F5;border-radius:14px;max-width:880px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);color:#2b2622}
.fermer{position:absolute;right:10px;top:8px;z-index:2;border:none;background:none;font-size:28px;line-height:1;color:#6b6259;cursor:pointer;padding:6px 10px}
.fiche-corps{display:grid;grid-template-columns:1.05fr 1fr;gap:26px;padding:26px}
.charge{padding:40px;text-align:center;color:#8a8076;font-size:14px}
.galerie .grande{aspect-ratio:1;background:#fff;border-radius:10px;overflow:hidden}
.galerie .grande img{width:100%;height:100%;object-fit:cover}
.vignettes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vignettes img{width:58px;height:58px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6;border:1px solid transparent}
.vignettes img.on{opacity:1;border-color:#B88A35}
.infos h2{font-family:Playfair Display,serif;font-weight:400;font-size:22px;line-height:1.25;margin:4px 30px 8px 0}
.prix{font-size:18px;color:#9A7024;margin-bottom:12px}.prix s{color:#9b938b;font-size:14px;margin-right:6px}
.texte{font-size:13px;line-height:1.6;color:#5d554e;margin:0 0 14px}
.opt{margin:12px 0}.opt-nom{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8a8076;margin-bottom:6px}
.choix{display:flex;flex-wrap:wrap;gap:6px}
.choix button{border:1px solid #d9d0c3;background:#fff;border-radius:999px;padding:6px 12px;font-family:Poppins,sans-serif;font-size:12.5px;cursor:pointer;color:#2b2622}
.choix button.on{background:#B88A35;border-color:#B88A35;color:#fff}
.ajoute{display:block;width:100%;margin-top:16px;border:none;border-radius:999px;background:#2C465E;color:#fff;font-family:Poppins,sans-serif;font-size:14px;letter-spacing:.04em;padding:13px 18px;cursor:pointer;transition:.18s}
.ajoute:hover:not(:disabled){background:#B88A35}
.ajoute:disabled{background:#b9b2a8;cursor:default}
.aime{display:block;width:100%;margin-top:8px;border:1px solid #d9c49a;background:#fff;border-radius:999px;padding:10px;font-family:Poppins,sans-serif;font-size:13px;color:#9A7024;cursor:pointer}
.complete{display:block;margin-top:14px;font-size:12px;color:#6b6259;text-align:center}
.voile#voileTiroir{justify-content:flex-end;padding:0}
.tiroir{position:relative;background:#FBF9F5;width:min(420px,100%);height:100%;overflow:auto;padding:28px 22px 30px;color:#2b2622;animation:glisse .3s ease}
@keyframes glisse{from{transform:translateX(40px);opacity:.4}to{transform:none;opacity:1}}
.tiroir h3{font-family:Playfair Display,serif;font-weight:400;font-size:22px;margin:0 30px 14px 0}
.ligne{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #ece5da}

.l-txt{flex:1;min-width:0}.l-nom{font-size:13px;line-height:1.35}.l-var{font-size:12px;color:#8a8076}.l-prix{font-size:13px;color:#9A7024;margin-top:2px}
.l-suppr{border:none;background:none;font-size:20px;color:#a39a90;cursor:pointer}

.note{font-size:12px;color:#8a8076;line-height:1.5}

.prenom{display:block;margin-top:16px;font-size:12px;color:#6b6259}.prenom input{display:block;width:100%;margin-top:6px;padding:9px 12px;border:1px solid #d9d0c3;border-radius:8px;font-family:Poppins,sans-serif;font-size:14px}

    tiroirCorps.innerHTML='<h3>'+(de?"La liste de cadeaux de "+esc(de):"Une liste de cadeaux pour toi")+'</h3><div class="charge">Un instant…</div>';
    voileTiroir.classList.add("vu"); document.body.classList.add("ouvert");
    Promise.all(hs.map(function(h){ return produit(h).then(function(d){return d;},function(){return null;}); })).then(function(ps){
      ps=ps.filter(Boolean);
      tiroirCorps.innerHTML='<h3>'+(de?"La liste de cadeaux de "+esc(de):"Une liste de cadeaux pour toi")+' 🎁</h3>'+(vx?'<div class="voeu-recu">« '+esc(vx)+' »</div>':'')+'<p class="note">Appuie sur un bijou pour le voir, choisir la taille et l\'ajouter au panier.</p>'+
        ps.map(function(p){ return '<div class="ligne"><img src="'+(p.images[0]||"").replace("width=900","width=200")+'" alt=""><div class="l-txt"><div class="l-nom">'+esc(p.titre)+'</div><div class="l-prix">'+prixTxt(p.variants)+'</div></div><button class="l-voir" data-voir="'+p.handle+'">Voir</button></div>'; }).join("")+
        '<button class="pastille" id="feuillette" style="margin-top:14px">Feuilleter le catalogue</button>';
      tiroirCorps.querySelectorAll("[data-voir]").forEach(function(b){ b.onclick=function(){ voileTiroir.classList.remove("vu"); ouvreFiche(b.dataset.voir, BASE+"/products/"+b.dataset.voir); }; });
      document.getElementById("feuillette").onclick=fermeTout;
    });
  }

  function fermeTout(){ retourChoix=null; voileFiche.classList.remove("vu"); voileTiroir.classList.remove("vu"); document.body.classList.remove("ouvert"); }
  [voileFiche,voileTiroir].forEach(function(vl){ vl.addEventListener("click",function(e){ if(e.target===vl || (e.target.closest && e.target.closest("[data-ferme]"))) fermeTout(); }); });
  document.getElementById("btnPanier").onclick=function(){ ouvreTiroir("panier"); };
  document.getElementById("btnListe").onclick=function(){ ouvreTiroir("liste"); };
  var toastT;
  function toast(t){ var el=document.getElementById("toast"); el.textContent=t; el.classList.add("vu"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("vu");},1800); }

  // ---------- la magie : neige, étincelles, bruit de page ----------
  var son=lit("moodNoelSon",true), ac=null;
  function majSon(){ document.getElementById("sonEtat").textContent=son?"son":"muet"; document.getElementById("btnSon").classList.toggle("off",!son); }
  document.getElementById("btnSon").onclick=function(){ son=!son; ecrit("moodNoelSon",son); majSon(); };
  majSon();
  function bruitPage(){
    if(!son) return;
    try{
      ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      var d=0.45, n=Math.floor(ac.sampleRate*d), buf=ac.createBuffer(1,n,ac.sampleRate), x=buf.getChannelData(0);
      for(var i=0;i<n;i++){ var t=i/n; x[i]=(Math.random()*2-1)*Math.pow(Math.sin(Math.PI*Math.min(1,t*1.4)),2)*(1-t); }
      var s=ac.createBufferSource(); s.buffer=buf;
      var f=ac.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(1800,ac.currentTime); f.frequency.linearRampToValueAtTime(700,ac.currentTime+d); f.Q.value=0.7;
      var g=ac.createGain(); g.gain.value=0.16;
      s.connect(f); f.connect(g); g.connect(ac.destination); s.start();
    }catch(e){}
  }
  function etincelles(el){
    var r=el.getBoundingClientRect();
    for(var i=0;i<18;i++){
      var s=document.createElement("span"); s.className="etincelle";
      s.style.left=(r.left+r.width/2)+"px"; s.style.top=(r.top+r.height/2)+"px";
      var a=Math.random()*Math.PI*2, dist=40+Math.random()*70;
      s.style.setProperty("--dx",Math.cos(a)*dist+"px"); s.style.setProperty("--dy",Math.sin(a)*dist+"px");
      document.body.appendChild(s); setTimeout(function(x){return function(){x.remove();};}(s),900);
    }
  }
  (function neige(){
    var cv=document.getElementById("neige"), cx=cv.getContext("2d"), fl=[], W, H;
    var calme=window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function taille(){ W=cv.width=window.innerWidth; H=cv.height=window.innerHeight; }
    taille(); window.addEventListener("resize",taille);
    var nb=calme?0:(W<900?45:90);
    for(var i=0;i<nb;i++) fl.push({x:Math.random()*W,y:Math.random()*H,r:0.8+Math.random()*2.2,v:0.25+Math.random()*0.7,o:Math.random()*Math.PI*2,a:0.35+Math.random()*0.5});
    function tour(){
      cx.clearRect(0,0,W,H);
      for(var i=0;i<fl.length;i++){ var p=fl[i]; p.y+=p.v; p.o+=0.01; p.x+=Math.sin(p.o)*0.35;
        if(p.y>H+5){ p.y=-5; p.x=Math.random()*W; }
        cx.beginPath(); cx.arc(p.x,p.y,p.r,0,6.283); cx.fillStyle="rgba(255,255,255,"+p.a+")"; cx.fill(); }
      requestAnimationFrame(tour);
    }
    if(nb) tour();
  })();

  // ouvrir sur une page : #p=12
  function depuisAdresse(){
    var m=(location.hash||"").match(/p=(\d+)/); if(!m) return;
    var p=Math.max(1,Math.min(NB,+m[1]));
    va(p===1?0:Math.floor(p/2));
    var c=piste.children[p-1]; if(c && window.innerWidth<=900) c.scrollIntoView({inline:"center",block:"nearest"});
  }
  window.addEventListener("hashchange",function(){ depuisAdresse(); listeRecue(); });
  liste.concat(panier).forEach(function(x){ if(x.s==="j") shopDe[x.h]="j"; });
  var monVoeu=lit("moodNoelVoeu","");
  document.querySelectorAll(".voeu-texte").forEach(function(t){ t.value=monVoeu;
    t.addEventListener("input",function(){ monVoeu=t.value; ecrit("moodNoelVoeu",monVoeu); document.querySelectorAll(".voeu-texte").forEach(function(o){ if(o!==t) o.value=monVoeu; }); });
    ["click","mousedown","keydown"].forEach(function(ev){ t.addEventListener(ev,function(e){ e.stopPropagation(); }); });
  });
  var sonInit=son; son=false; rendu(); depuisAdresse(); son=sonInit; compteurs(); listeRecue();
})();
</script>
