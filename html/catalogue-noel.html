.leaf.flip .face.recto a,.leaf:not(.flip) .face.verso a{visibility:hidden;pointer-events:none}

.face.recto::after{content:"";position:absolute;left:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,rgba(0,0,0,.10),transparent);pointer-events:none}
.face.verso::after{content:"";position:absolute;right:0;top:0;bottom:0;width:30px;background:linear-gradient(270deg,rgba(0,0,0,.10),transparent);pointer-events:none}

.nav .pos{color:#CFC2A2;font-size:11.5px;letter-spacing:.14em;min-width:110px;text-align:center}
