@keyframes tete{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}

@keyframes saute{0%,100%{transform:translateY(0)}50%{transform:translateY(-14%) rotate(-4deg)}}
@keyframes glisse{0%,100%{transform:translateX(-18%) rotate(-6deg)}50%{transform:translateX(22%) rotate(6deg)}}

@keyframes glisse3{0%,100%{transform:translateX(-12%) rotate(4deg)}50%{transform:translateX(18%) rotate(-6deg)}}
@keyframes trot{0%,100%{transform:translate(0,0)}25%{transform:translate(-2%,-2%)}50%{transform:translate(-4%,0)}75%{transform:translate(-2%,-2%)}}
@keyframes tire{0%,100%{transform:translateX(0) rotate(0)}50%{transform:translateX(-6%) rotate(-1.5deg)}}
.lu{position:absolute;width:var(--s);height:var(--s);margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);border-radius:50%;background:radial-gradient(circle,rgba(255,246,200,.95) 0,rgba(255,214,120,.55) 30%,rgba(255,200,90,0) 70%);animation:brille 2s steps(3) infinite;pointer-events:none;mix-blend-mode:screen}

.fu{position:absolute;width:2.2%;aspect-ratio:1;margin-left:-1.1%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(240,244,248,.75) 45%,rgba(255,255,255,0) 72%);animation:fume 4s steps(8) infinite;pointer-events:none}
@keyframes fume{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:.95}100%{transform:translate(60%,-520%) scale(2.2);opacity:0}}
#neige{position:absolute;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#neige i{position:absolute;top:-12%;animation:tombe linear infinite}
#neige s{display:block;width:100%;height:100%;background:url(https://mood-tools.yourmood.net/calendrier/village/flocon.png) center/contain no-repeat;animation:tourne linear infinite;filter:drop-shadow(0 0 1.5px rgba(47,82,96,.22))}

.vil{container-type:inline-size}
.mz{position:absolute;z-index:27;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%);transform-origin:50% -60%;animation:flotte 4s steps(8) infinite;filter:none;text-decoration:none;display:block}
@keyframes flotte{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}
@keyframes pend{0%,100%{transform:translate(-50%,-50%) rotate(-1.2deg)}50%{transform:translate(-50%,-50%) rotate(1.2deg)}}
.mz .pl::after{content:'';position:absolute;left:50%;bottom:-.45cqw;margin-left:-.45cqw;border:.45cqw solid transparent;border-bottom:0;border-top-color:rgba(255,255,255,.93)}
.mz .fi{display:none}
.mz .pl{display:block;position:relative;background:rgba(255,255,255,.93);padding:.35cqw .9cqw .4cqw;border-radius:2cqw;box-shadow:0 .2cqw .8cqw rgba(20,40,52,.25);text-align:center;transition:text-shadow .3s}

.mz .un{position:static;display:block;color:#8a7350!important;max-height:none;overflow:visible;font:400 .55cqw/1.4 Poppins,sans-serif;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;transition:max-height .35s,margin .35s}
.mz:hover{animation-play-state:paused;z-index:40}
.mz:hover .pl,.mz.actif .pl{box-shadow:0 0 1.4cqw .3cqw rgba(255,214,120,.85)}

.pt{position:absolute;top:10%;width:.45cqw;height:.45cqw;background:var(--c);border-radius:50%;opacity:0;animation:monte 3.2s steps(10) infinite;pointer-events:none;box-shadow:0 0 .5cqw var(--c)}
.pt.etoile{border-radius:0;clip-path:polygon(50% 0,61% 38%,100% 38%,68% 60%,80% 100%,50% 75%,20% 100%,32% 60%,0 38%,39% 38%);width:.7cqw;height:.7cqw;box-shadow:none}

/* ---- calendrier (27.11.2026) : tout tient sur un seul écran, la boîte posée au premier plan du village ---- */
html,body{height:100%}
body{display:flex;align-items:center;justify-content:center;overflow:hidden;background:#e9edf2}
body::before{content:'';position:fixed;inset:-60px;background:url(https://mood-tools.yourmood.net/calendrier/village/fond.jpg) center/cover;filter:blur(22px) brightness(1.03);z-index:-1}
.vil{box-shadow:0 0 60px rgba(30,50,60,.25)}
.vil{width:min(100vw,calc(100vh * 2400 / 1792));max-width:none}
.vil::after{content:"";position:absolute;inset:0;background:rgba(18,34,44,.5);opacity:0;transition:opacity .4s steps(4);pointer-events:none;z-index:29}
.vil.survol::after{opacity:1}
.cj-compte{display:inline-block;margin-top:.8cqw;background:rgba(255,255,255,.9);border-radius:2cqw;padding:.35cqw 1.1cqw;font:400 .85cqw Poppins,sans-serif;letter-spacing:.06em;color:#2f5260;box-shadow:0 .2cqw .8cqw rgba(20,40,52,.18)}

.cj-t{position:absolute;display:block;text-decoration:none;z-index:2}

.cj-btn:hover{transform:translateY(-.2cqw)}

for(var i=0;i<18;i++){var e=document.createElement("i"),r=Math.random(),s=r<.2?70+Math.random()*60:(r<.5?32+Math.random()*26:14+Math.random()*16);
e.style.cssText="left:"+(Math.random()*100)+"%;width:"+s+"px;height:"+s*1.1+"px;opacity:"+(.88+Math.random()*.12)+";animation-duration:"+(s>70?15+Math.random()*8:9+Math.random()*10)+"s;animation-delay:-"+(Math.random()*20)+"s";
var t=document.createElement("s");t.style.animationDuration=(4+Math.random()*6)+"s";if(Math.random()<.5)t.style.animationDirection="reverse";e.appendChild(t);n.appendChild(e);}
for(var j=0;j<40;j++){var d=document.createElement("b"),z=2+Math.random()*4;d.style.cssText="left:"+(Math.random()*100)+"%;width:"+z+"px;height:"+z+"px;opacity:"+(.6+Math.random()*.4)+";animation-duration:"+(7+Math.random()*10)+"s;animation-delay:-"+(Math.random()*17)+"s";n.appendChild(d);}
(function(){var vil=document.getElementById("vil"),ms=[].slice.call(document.querySelectorAll(".ms")),zs=[].slice.call(document.querySelectorAll(".mz")),cur=-1,auto=true;
function sg(m){return zs.filter(function(z){return z.querySelector(".nm").textContent==m.dataset.u})[0]}
function show(i){ms.forEach(function(m,j){m.classList.toggle("on",j==i);var z=sg(m);if(z)z.classList.toggle("actif",j==i);});cur=i;}
ms.forEach(function(m,i){var z=sg(m);[m,z].forEach(function(el){if(!el)return;el.addEventListener("mouseenter",function(){show(i);});el.addEventListener("mouseleave",function(){show(-1);});el.addEventListener("click",function(e){e.preventDefault();});});});})();
var v=document.getElementById("vil"),sc=document.getElementById("sc");v.addEventListener("mousemove",function(ev){var b=v.getBoundingClientRect(),x=(ev.clientX-b.left)/b.width-.5,y=(ev.clientY-b.top)/b.height-.5;sc.style.transform="translate("+(-x*10)+"px,"+(-y*6)+"px)";});})();

<script>
(function(){
  var API = (location.hostname === 'mood-tools.yourmood.net' || location.hostname === 'localhost' || location.hostname === 'katana-scanner-mvp.vercel.app') ? '/api/calendrier-jours' : 'https://mood-tools.yourmood.net/api/calendrier-jours';
  var q = new URLSearchParams(location.search), jourApercu = q.get('jour');
  var MOIS = ' décembre', TACTILE = window.matchMedia && matchMedia('(hover: none)').matches;
  var vil = document.getElementById('vil'), boite = document.getElementById('cj-boite');
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function pad(n){ return (n < 10 ? '0' : '') + n; }
  function etincelles(nb){ var h = ''; for (var i = 0; i < nb; i++) h += '<span class="sc2" style="left:' + (Math.random() * 100).toFixed(0) + '%;top:' + (Math.random() * 100).toFixed(0) + '%;animation-delay:-' + (Math.random() * 1.4).toFixed(2) + 's"></span>'; return h; }
  function chrono(jour){
    var el = document.getElementById('cj-compte'), t = document.getElementById('cj-chrono');
    if (jourApercu !== null || jour >= 24) return;
    var cible = new Date((jour === 0 ? '2026-12-01' : '2026-12-' + pad(jour + 1)) + 'T00:00:00+01:00'); el.hidden = false;
    function tic(){ var s = Math.max(0, Math.floor((cible - new Date()) / 1000)); if (s <= 0) { location.reload(); return; }
      var j = Math.floor(s / 86400); s %= 86400; t.textContent = (j ? j + ' j ' : '') + pad(Math.floor(s / 3600)) + ':' + pad(Math.floor(s % 3600 / 60)) + ':' + pad(s % 60); }
    tic(); setInterval(tic, 1000);
  }
  // tiroirs mesurés sur la boîte (photo d'origine 1441 × 1092, découpée à partir de 101,104 → 1260 × 886)
  var IW = 1260, IH = 886, OX = 101, OY = 104, COLS = [[114,259,411,557,700],[749,892,1038,1188,1340]], ROWS = [[513,654],[663,804],[813,962]];
  function rect(n){ var c2 = n > 12 ? 1 : 0, k = (n - 1) % 12, r = Math.floor(k / 4), c = k % 4; return { x: COLS[c2][c] + 2 - OX, y: ROWS[r][0] + 2 - OY, w: COLS[c2][c + 1] - COLS[c2][c] - 4, h: ROWS[r][1] - ROWS[r][0] - 4 }; }
  function pos(R){ return 'left:' + (R.x / IW * 100) + '%;top:' + (R.y / IH * 100) + '%;width:' + (R.w / IW * 100) + '%;height:' + (R.h / IH * 100) + '%'; }
  function porte(R){ return 'background-size:' + (IW / R.w * 100) + '% ' + (IH / R.h * 100) + '%;background-position:' + (R.x / (IW - R.w) * 100) + '% ' + (R.y / (IH - R.h) * 100) + '%'; }
  function montre(t){ boite.querySelectorAll('.cj-t.on').forEach(function(o){ if (o !== t) o.classList.remove('on'); }); if (t) t.classList.add('on'); vil.classList.toggle('survol', !!t); }
  function rendre(d){
    var jour = d.jour, par = {}; (d.jours || []).forEach(function(x){ par[x.n] = x; }); var auj = par[jour];
    if (auj) {
      document.getElementById('cj-vedette').outerHTML = '<div class="cj-vedette"><span class="pl"><span class="un">' + (jour >= 24 && jourApercu === null ? 'La dernière pépite' : 'Aujourd\'hui · ' + jour + (jour === 1 ? 'er' : '') + MOIS) + '</span><span class="nm">' + esc(auj.nom) + '</span><span class="cj-prix">' + esc(auj.type || '') + (auj.prix ? ' · ' + auj.prix + '.–' : '') + '</span></span>' +
        '<div class="cj-stick"><img src="' + esc(auj.image) + '" alt="' + esc(auj.nom) + '">' + etincelles(5) + '</div>' +
        
        (auj.url ? '<a class="cj-btn" href="' + esc(auj.url) + '">Je la découvre</a>' : '') + '</div>';
    } else if (!jour) {
      document.getElementById('cj-sous').textContent = 'Le premier tiroir s\'ouvre le 1er décembre, à minuit…';
    }
    var g = '';
    for (var n = 1; n <= 24; n++) {
      var x = par[n], R = rect(n);
      if (x) g += '<a class="cj-t ouvert' + (n === jour ? ' auj' : '') + '" style="' + pos(R) + '"' + (x.url ? ' href="' + esc(x.url) + '"' : '') + ' aria-label="' + esc(n + ' décembre · ' + x.nom) + '">' +
          '<span class="cj-ph"><img loading="lazy" src="' + esc(x.photo || x.image) + '" alt=""></span><span class="cj-pn">' + n + '</span>' +
          '<span class="cj-pl"><span class="nm">' + esc(x.nom) + '</span><span class="un">' + esc(x.type || '') + '</span></span>' + etincelles(3) +
          (n === jour ? '<span class="cj-porte" style="' + porte(R) + '"></span>' : '') + '</a>';
      else g += '<span class="cj-t ferme" data-n="' + n + '" style="' + pos(R) + '"></span>';
    }
    boite.insertAdjacentHTML('beforeend', g);
    boite.querySelectorAll('.cj-t.ouvert').forEach(function(t){
      t.addEventListener('mouseenter', function(){ if (!TACTILE) montre(t); });
      t.addEventListener('mouseleave', function(){ if (!TACTILE) montre(null); });
      t.addEventListener('click', function(e){ if (TACTILE && !t.classList.contains('on')) { e.preventDefault(); montre(t); } });
    });
    boite.addEventListener('click', function(e){
      var t = e.target.closest && e.target.closest('.cj-t.ferme'); if (!t) return;
      t.classList.remove('secoue'); void t.offsetWidth; t.classList.add('secoue');
      var old = boite.querySelector('.cj-bulle'); if (old) old.remove();
      var b = document.createElement('span'), n = +t.dataset.n; b.className = 'cj-bulle';
      b.textContent = n === jour + 1 ? 'Patience… il s\'ouvre cette nuit' : 'Patience… il s\'ouvre le ' + n + (n === 1 ? 'er' : '') + MOIS;
      b.style.left = (parseFloat(t.style.left) + parseFloat(t.style.width) / 2) + '%'; b.style.top = t.style.top;
      boite.appendChild(b); setTimeout(function(){ b.style.opacity = 0; setTimeout(function(){ b.remove(); }, 300); }, 1800);
    });
    var tAuj = boite.querySelector('.cj-t.auj');
    if (tAuj) setTimeout(function(){ var p = tAuj.querySelector('.cj-porte'); if (p) p.classList.add('ouvert');
      setTimeout(function(){ montre(tAuj); setTimeout(function(){ if (!tAuj.matches(':hover')) montre(null); }, 2400); }, 750); }, 1200);
    chrono(jour);
  }
  fetch(API + (jourApercu !== null ? '?jour=' + encodeURIComponent(jourApercu) : '')).then(function(r){ return r.json(); }).then(rendre).catch(function(){ rendre({ jour: 0, jours: [] }); });
})();
</script></body></html>
