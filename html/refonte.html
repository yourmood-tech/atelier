<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La refonte du site</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ivoire:#FBFAF8;--encre:#1A1818;--gris:#8A8480;--trait:#E8E4DF;--vert:#2F7D5B;--rose:#C2185B}
*{box-sizing:border-box}
body{margin:0;background:var(--ivoire);color:var(--encre);font-family:Poppins,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:44px 0 18px}
h1{font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(30px,5vw,46px);margin:0 0 6px}
.sub{color:var(--gris);font-size:15px;font-weight:300;max-width:620px;line-height:1.55}
.barre{position:sticky;top:0;z-index:20;background:rgba(251,250,248,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--trait);padding:12px 0;margin-bottom:10px}
.barre .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.jauge{flex:1;min-width:200px;height:8px;background:var(--trait);border-radius:99px;overflow:hidden}
.jauge i{display:block;height:100%;background:var(--vert);width:0;transition:width .4s}
.compte{font-size:13px;color:var(--gris);white-space:nowrap}
select,input{font-family:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--trait);border-radius:99px;background:#fff;color:inherit}
input{min-width:200px}
h2{font-family:'Playfair Display',serif;font-weight:400;font-size:26px;margin:38px 0 4px;display:flex;align-items:baseline;gap:12px}
h2 small{font-family:Poppins;font-size:12px;font-weight:400;color:var(--gris);letter-spacing:.08em;text-transform:uppercase}
h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin:22px 0 6px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);text-align:center;padding:8px 4px;font-weight:500}
th.n{text-align:left;padding-left:2px}
td{border-top:1px solid var(--trait);padding:9px 4px;vertical-align:middle}
td.n{font-size:14.5px}
td.n em{display:block;font-style:normal;font-size:12px;color:var(--gris);margin-top:2px}
td.c{text-align:center;width:86px}
label.case{display:inline-flex;width:22px;height:22px;border:1.5px solid #CFC9C3;border-radius:6px;cursor:pointer;align-items:center;justify-content:center;transition:.15s}
label.case input{display:none}
label.case:hover{border-color:var(--gris)}
label.case.on{background:var(--vert);border-color:var(--vert)}
label.case.on:after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
label.case.fin.on{background:var(--encre);border-color:var(--encre)}
tr.fini td.n{color:var(--gris);text-decoration:line-through;text-decoration-color:#D9D4CE}
.etat{position:fixed;right:16px;bottom:16px;background:var(--encre);color:#fff;font-size:12.5px;padding:9px 16px;border-radius:99px;opacity:0;transition:.3s;pointer-events:none}
.etat.v{opacity:1}
footer{padding:50px 0 70px;color:var(--gris);font-size:12.5px;text-align:center}
@media(max-width:700px){td.c{width:56px}td.n{font-size:13.5px}}
</style></head><body>

</header></div>

</div></div>

function charger(){
 fetch('/api/refonte').then(function(r){return r.json()}).then(function(j){ etats=j.etats||{}; rendu(); }).catch(function(){ rendu(); });
}
function enregistrer(){
 clearTimeout(minuteur);
 minuteur=setTimeout(function(){
  fetch('/api/refonte',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({etats:etats})})
   .then(function(){ var e=document.getElementById('etat'); e.classList.add('v'); setTimeout(function(){e.classList.remove('v')},1200); });
 },500);
}
function fini(id){ var v=etats[id]||[]; return v.indexOf('Terminé')>=0; }
function rendu(){
 var q=(document.getElementById('q').value||'').toLowerCase();
 var ff=document.getElementById('f').value, fe=document.getElementById('e').value;
 var L=P.filter(function(p){
  if(ff&&p.fam!==ff) return false;
  if(fe==='fini'&&!fini(p.id)) return false;
  if(fe==='reste'&&fini(p.id)) return false;
  if(q&&(p.nom+' '+p.sous+' '+p.fam+' '+(p.det||'')).toLowerCase().indexOf(q)<0) return false;
  return true;
 });
 var h='', fam='', sous='';
 L.forEach(function(p){
  if(p.fam!==fam){ if(fam)h+='</tbody></table>'; fam=p.fam; sous='';
   var n=P.filter(function(x){return x.fam===fam}).length, f=P.filter(function(x){return x.fam===fam&&fini(x.id)}).length;
   h+='<h2>'+fam+' <small>'+f+' / '+n+'</small></h2>'; }
  if(p.sous!==sous){ if(sous)h+='</tbody></table>'; sous=p.sous;
   h+='<h3>'+p.sous+'</h3><table><thead><tr><th class="n">Pièce</th>'+ETAPES.map(function(e){return '<th>'+e+'</th>'}).join('')+'</tr></thead><tbody>'; }
  var v=etats[p.id]||[];
  h+='<tr class="'+(fini(p.id)?'fini':'')+'"><td class="n">'+p.nom+(p.det?'<em>'+p.det+'</em>':'')+'</td>'+
   ETAPES.map(function(e){ var on=v.indexOf(e)>=0;
    return '<td class="c"><label class="case'+(on?' on':'')+(e==='Terminé'?' fin':'')+'" data-id="'+p.id+'" data-e="'+e+'"></label></td>'; }).join('')+'</tr>';
 });
 if(fam)h+='</tbody></table>';
 document.getElementById('liste').innerHTML=h||'<p style="color:#8A8480;padding:30px 0">Rien ne correspond.</p>';
 var tot=P.length, done=P.filter(function(p){return fini(p.id)}).length;
 document.getElementById('j').style.width=(tot?Math.round(done/tot*100):0)+'%';
 document.getElementById('c').textContent=done+' terminées sur '+tot+'  ·  '+(tot?Math.round(done/tot*100):0)+'%';
}
document.addEventListener('click',function(ev){

});
['q','f','e'].forEach(function(k){ document.getElementById(k).addEventListener('input',rendu); });
