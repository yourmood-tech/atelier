<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demandes de motifs — atelier mood</title>
<style>
  :root{
    --ivory:#f6f2ea; --paper:#fffdf9; --ink:#2a2621;
    --muted:#8a8072; --gold:#b28a3c; --gold-soft:#caa25a; --line:#e7e0d1;
    --serif:"Cormorant Garamond",Didot,"Playfair Display",Georgia,serif;
    --sans:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);
    background:radial-gradient(130% 100% at 50% -20%,var(--paper),var(--ivory) 70%);min-height:100vh}
  .wrap{max-width:1020px;margin:0 auto;padding:30px 18px 64px}
  header{text-align:center;margin-bottom:22px}
  .eyebrow{font-size:.66rem;letter-spacing:.42em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 10px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,5vw,2.8rem);margin:0;line-height:1.05}
  .sub{color:var(--muted);margin:10px auto 0;max-width:560px;font-size:.9rem;line-height:1.55}
  .rule{width:52px;height:1px;background:var(--gold);opacity:.6;margin:16px auto 0}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px;
    box-shadow:0 22px 46px -34px rgba(120,100,60,.4)}
  .top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:baseline}
  .who{font-family:var(--serif);font-size:1.3rem;font-weight:600}
  .when{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums}
  .mail{margin-left:auto;font-size:.85rem}
  .mail a{color:var(--gold);text-decoration:none}
  .mail a:hover{text-decoration:underline}
  .facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:12px;padding:12px 14px;border-radius:12px;
    border:1px dashed var(--gold-soft);background:color-mix(in srgb,var(--gold) 7%,var(--paper));font-size:.85rem}
  .facts b{color:var(--gold);font-variant-numeric:tabular-nums}
  .bandscroll{overflow-x:auto;border-radius:10px;margin-top:14px}
  .band{padding:0;min-width:100%;border-radius:9px;overflow:hidden;
    background:linear-gradient(180deg,#e9edf1,#fff 8%,#cfd5db 20%,#aeb4bd 50%,#cfd5db 80%,#fff 92%,#e9edf1);
    box-shadow:inset 0 2px 3px rgba(255,255,255,.9),inset 0 -2px 3px rgba(0,0,0,.3),0 10px 24px -16px rgba(60,70,90,.5)}
  .railb{height:11px;background:linear-gradient(180deg,#f7f9fb,#c3c9d1 55%,#9198a2);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(0,0,0,.35)}
  .grid{display:grid;gap:1px;padding:5px 6px;background:linear-gradient(180deg,#b9bfc8,#9aa0aa)}
  .band.nobase{background:linear-gradient(180deg,#eef1f4,#e2e6ea);box-shadow:0 10px 24px -18px rgba(60,70,90,.4)}
  .band.nobase .grid{padding:1px;gap:.5px;background:#d3d8de}
  .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 35%,#e3e7ec,#aeb4bd);border-radius:2px}
  .cell .gemc{width:90%;height:90%;border-radius:50%}
  .legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin-top:14px;align-items:center}
  .tly{display:flex;align-items:center;gap:7px;font-size:.82rem;color:var(--muted)}
  .tly b{color:var(--ink);font-variant-numeric:tabular-nums}
  .chip{width:15px;height:15px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.12)}
  .btn{background:color-mix(in srgb,var(--paper) 88%,var(--ivory));border:1px solid var(--line);color:var(--ink);
    border-radius:999px;padding:8px 16px;cursor:pointer;font:inherit;font-size:.78rem;transition:.15s}
  .btn:hover{border-color:var(--gold);color:var(--gold)}
  .actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px;align-items:center}
  .spacer{flex:1}
  .empty{text-align:center;color:var(--muted);padding:48px 18px;font-size:.92rem;line-height:1.7}
  .count{text-align:center;color:var(--muted);font-size:.8rem;margin-top:4px}
  .foot{color:var(--muted);font-size:.74rem;text-align:center;margin-top:28px;line-height:1.6}
  @media (max-width:520px){ .mail{margin-left:0;width:100%} }
</style>
</head><body>

<div class="wrap">
  <header>
    <p class="eyebrow">atelier mood · privé</p>
    <h1>Demandes de motifs</h1>
    <p class="sub">Chaque cliente qui compose sa bague sur la page publique arrive ici — avec son motif redessiné à l'identique et la liste pierre par pierre pour le sertissage.</p>
    <div class="rule"></div>
    <p class="count" id="count"></p>
  </header>
  <div id="liste"></div>
  <p class="foot">Page privée — atelier mood Joaillerie. La page des clientes : <a href="/motif" style="color:var(--gold)">/motif</a></p>
</div>

<script>
/* La liste est injectée à la place du repère ci-dessous par app/motif/admin/route.ts
   (même convention que projet-joaillerie-admin.html). */
const DEMANDES = /*__DEMANDES__*/;

/* rendu d'une pierre — repris à l'identique de la page cliente */
const mul=(h,f)=>{const n=parseInt(h.slice(1),16);return`rgb(${Math.min(255,(((n>>16)&255)*f)|0)},${Math.min(255,(((n>>8)&255)*f)|0)},${Math.min(255,((n&255)*f)|0)})`;};
function gemBG(s){const f=mul(s.c,.62),h=s.hi||'#ffffff';
  return `radial-gradient(circle at 34% 25%, #ffffff, rgba(255,255,255,0) 15%),`
    +`conic-gradient(from 0deg at 50% 50%, rgba(255,255,255,.9), rgba(255,255,255,0) 8deg, rgba(255,255,255,0) 82deg, rgba(255,255,255,.8) 90deg, rgba(255,255,255,0) 98deg, rgba(255,255,255,0) 172deg, rgba(255,255,255,.7) 180deg, rgba(255,255,255,0) 188deg, rgba(255,255,255,0) 262deg, rgba(255,255,255,.7) 270deg, rgba(255,255,255,0) 278deg, rgba(255,255,255,0) 352deg, rgba(255,255,255,.9) 360deg),`
    +`conic-gradient(from 14deg at 50% 50%, ${h}, ${f} 24deg, ${h} 48deg, ${f} 72deg, ${h} 96deg, ${f} 120deg, ${h} 144deg, ${f} 168deg, ${h} 192deg, ${f} 216deg, ${h} 240deg, ${f} 264deg, ${h} 288deg, ${f} 312deg, ${h} 336deg, ${f}),`
    +`radial-gradient(circle at 50% 50%, transparent 0 20%, rgba(0,0,0,.28) 30%, transparent 40%),`
    +`radial-gradient(circle at 50% 50%, ${h} 0%, ${s.c} 22%, ${mul(s.c,.9)} 46%, ${mul(s.c,.5)} 100%)`;}
const setShadow='inset 0 0 0 1px rgba(0,0,0,.34),inset 0 -1px 2px rgba(0,0,0,.55),inset 0 1px 2px rgba(255,255,255,.75),0 0 0 .7px rgba(150,155,165,.95),0 0 2px rgba(255,255,255,.55)';

const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function dateFR(iso){
  try{ return new Date(iso).toLocaleString('fr-CH',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Europe/Zurich'}); }
  catch{ return String(iso||''); }
}

/* redessine le motif : 1 lettre = 1 diamant, rangée par rangée */
function bande(d){
  const pal = Array.isArray(d.palette)&&d.palette.length ? d.palette : [{key:'blanc',label:'Diamant blanc',c:'#e6ebf2',hi:'#ffffff'}];
  const cols = Number(d.parTour)||0, rows = Number(d.rangees)||0;
  const motif = String(d.motif||'');
  if(!cols||!rows||!motif) return '<p style="color:var(--muted);font-size:.82rem;margin-top:12px">Motif non enregistré pour cette demande.</p>';

  const band=document.createElement('div');
  band.className='band'+(d.aBase===false?' nobase':'');
  band.innerHTML='<div class="railb"></div>';
  const grid=document.createElement('div');
  grid.className='grid';
  grid.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  // largeur : ~13px par diamant, jamais moins que la largeur de la carte
  band.style.width = Math.max(cols*13, 320)+'px';

  for(let i=0;i<rows*cols;i++){
    const s = pal[(motif.charCodeAt(i)||97)-97] || pal[0];
    const cell=document.createElement('div'); cell.className='cell';
    const gem=document.createElement('div'); gem.className='gemc';
    gem.style.background=gemBG(s); gem.style.boxShadow=setShadow;
    cell.appendChild(gem); grid.appendChild(cell);
  }
  band.appendChild(grid);
  band.insertAdjacentHTML('beforeend','<div class="railb"></div>');
  const scroll=document.createElement('div'); scroll.className='bandscroll'; scroll.appendChild(band);
  return scroll.outerHTML;
}

function texteSertissage(d){
  const l=[];
  l.push(`Demande de motif — ${d.prenom||''} ${d.nom||''} (${d.email||''})`);
  l.push(`Reçue le ${dateFR(d.date)}`);
  l.push(`Taille ${d.taille} · ${d.config}`);
  l.push(`${d.rangees} rangées × ${d.parTour} = ${d.total} diamants`);
  l.push('Pierre par pierre :');
  const p=Array.isArray(d.pierres)?d.pierres:[];
  if(p.length) p.forEach(x=>l.push(`  ${x.nombre} × ${x.label||x.key}`));
  else l.push('  toutes en diamant blanc');
  l.push('');
  l.push('Motif rangée par rangée (1 lettre = 1 diamant, ordre de la palette) :');
  const cols=Number(d.parTour)||0, m=String(d.motif||'');
  for(let r=0;r<(Number(d.rangees)||0);r++) l.push(`  R${r+1}: ${m.slice(r*cols,(r+1)*cols)}`);
  const pal=Array.isArray(d.palette)?d.palette:[];
  if(pal.length) l.push('  Palette : '+pal.map((s,i)=>`${String.fromCharCode(97+i)}=${s.label}`).join(' · '));
  return l.join('\n');
}

function carte(d,i){
  const p=Array.isArray(d.pierres)?d.pierres:[];
  const legende = p.length
    ? p.map(x=>`<span class="tly"><span class="chip" style="background:${esc(x.couleur||'#ccc')}"></span><b>${esc(x.nombre)}</b> × ${esc(x.label||x.key)}</span>`).join('')
    : '<span class="tly">Toutes en diamant blanc</span>';
  return `<div class="card">
    <div class="top">
      <span class="who">${esc(d.prenom)} ${esc(d.nom)}</span>
      <span class="when">${esc(dateFR(d.date))}</span>
      <span class="mail"><a href="mailto:${esc(d.email)}">${esc(d.email)}</a></span>
    </div>
    <div class="facts">
      <span>Taille <b>${esc(d.taille)}</b></span>
      <span>${esc(d.config)}</span>
      <span>${esc(d.rangees)} rangées × ${esc(d.parTour)} = <b>${esc(d.total)}</b> diamants</span>
    </div>
    ${bande(d)}
    <div class="legend">${legende}</div>
    <div class="actions">
      <button class="btn" data-copie="${i}">Copier pour la sertisseuse</button>
      <span class="spacer"></span>
      <a class="btn" style="text-decoration:none" href="mailto:${esc(d.email)}?subject=${encodeURIComponent('Votre projet de bague en pierres — mood Joaillerie')}">Répondre à ${esc(d.prenom)}</a>
    </div>
  </div>`;
}

const liste=document.getElementById('liste');
if(!DEMANDES.length){
  liste.innerHTML='<div class="card"><p class="empty">Aucune demande pour l\'instant.<br>Dès qu\'une cliente enverra son motif depuis la page publique, elle apparaîtra ici.</p></div>';
}else{
  document.getElementById('count').textContent = DEMANDES.length + (DEMANDES.length>1?' demandes reçues':' demande reçue');
  liste.innerHTML = DEMANDES.map(carte).join('');
  liste.addEventListener('click',async e=>{
    const b=e.target.closest('[data-copie]'); if(!b)return;
    try{
      await navigator.clipboard.writeText(texteSertissage(DEMANDES[Number(b.dataset.copie)]));
      const t=b.textContent; b.textContent='Copié ✓';
      setTimeout(()=>{b.textContent=t;},1600);
    }catch{ b.textContent='Copie impossible'; }
  });
}
</script>

</body></html>
