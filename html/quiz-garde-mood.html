  :root[data-theme="dark"]{--ground:#17140f;--paper:#221d16;--ink:#f1ebdd;--ink-soft:#a79c8a;--line:#3a3123;--gold:#d6b25f;--gold-soft:#b5934a}

  body{margin:0;background:radial-gradient(120% 90% at 50% -10%,var(--paper),var(--ground) 68%);

  .wrap{max-width:760px;margin:0 auto;padding-block:34px 70px;padding-left:20px;padding-right:20px}
  header{text-align:center}
  .eyebrow{font-size:.62rem;letter-spacing:.44em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0 0 12px}
  h1{font-family:var(--serif);font-weight:500;font-size:clamp(1.9rem,5.4vw,2.9rem);line-height:1.04;margin:0;text-wrap:balance}
  h1 em{font-style:italic;color:var(--gold)}
  .rule{width:46px;height:1px;background:var(--gold);opacity:.6;margin:15px auto 0}
  .jauge{display:flex;gap:6px;justify-content:center;margin-top:22px}
  .jauge i{width:24px;height:2px;background:var(--line);border-radius:2px;transition:.3s}
  .jauge i.on{background:var(--gold)}
  .carte{margin-top:24px;background:var(--paper);border:1px solid var(--line);border-radius:16px;
    padding:clamp(20px,4vw,32px);box-shadow:0 24px 50px -38px rgba(120,100,60,.45)}
  .etape{font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);font-weight:700}
  .question{font-family:var(--serif);font-size:clamp(1.4rem,4vw,2rem);line-height:1.15;margin:8px 0 0;text-wrap:balance;font-weight:500}
  .aide{color:var(--ink-soft);font-size:.86rem;margin:9px 0 0}
  .choix{display:grid;gap:9px;margin-top:20px}
  .choix.tuiles{grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .choix.tuiles button{flex-direction:column;gap:0;padding:0;border:0;background:none;box-shadow:none}
  .choix.tuiles button:hover{transform:translateY(-3px);box-shadow:none}
  .choix.tuiles img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:50%;
    border:1px solid var(--line);transition:.18s}
  .choix.tuiles button:hover img{border-color:var(--gold);box-shadow:0 14px 30px -20px rgba(120,100,60,.8)}
  .invisible{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .choix button{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
    background:color-mix(in srgb,var(--paper) 86%,var(--ground));border:1px solid var(--line);
    border-radius:12px;padding:15px 17px;cursor:pointer;font:inherit;color:var(--ink);transition:.16s}
  .choix button:hover{border-color:var(--gold);transform:translateY(-1px);box-shadow:0 10px 22px -18px rgba(120,100,60,.7)}
  .choix button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .choix .em{font-size:1.25rem;line-height:1;flex:0 0 auto;width:24px;text-align:center;color:var(--gold)}
  .choix .lib{font-family:var(--serif);font-size:1.18rem;line-height:1.25}
  .barre{display:flex;gap:10px;align-items:center;margin-top:20px;flex-wrap:wrap}
  .lien{background:none;border:0;color:var(--ink-soft);font:inherit;font-size:.82rem;cursor:pointer;
    padding:6px 2px;text-decoration:underline;text-underline-offset:3px}
  .lien:hover{color:var(--gold)}
  .fil{font-size:.78rem;color:var(--ink-soft);margin-left:auto;text-align:right}
  .cta{display:inline-block;background:var(--gold);color:#fff;border:0;border-radius:999px;
    padding:14px 30px;font:inherit;font-weight:700;font-size:.88rem;cursor:pointer;text-decoration:none;transition:.15s}
  .cta:hover{background:var(--gold-soft)}
  /* révélation */
  .photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--ground);
    border:1px solid var(--line);max-width:100%}
  .reveal h2{font-family:var(--serif);font-size:clamp(1.6rem,4.4vw,2.25rem);margin:12px 0 0;font-weight:500;text-wrap:balance}
  .prix{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700;font-size:1.15rem;margin:6px 0 0}
  .cadeau{margin-top:16px;padding:13px 15px;border-radius:12px;border:1px dashed var(--gold-soft);
    background:color-mix(in srgb,var(--gold) 8%,var(--paper));font-size:.88rem}
  .cadeau b{color:var(--gold);letter-spacing:.06em}
  .champ{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font:inherit;
    font-size:1rem;color:var(--ink);background:color-mix(in srgb,var(--paper) 92%,var(--ground));margin-top:16px}
  .champ:focus{outline:2px solid var(--gold-soft);outline-offset:1px;border-color:var(--gold)}
  .err{color:#a3341f;font-size:.84rem;margin:8px 0 0}
  .rgpd{font-size:.76rem;color:var(--ink-soft);margin:12px 0 0;line-height:1.5}
  .roul{font-family:var(--serif);font-size:1.6rem;color:var(--gold);text-align:center;padding:36px 0}
  footer{margin-top:30px;text-align:center;font-size:.74rem;color:var(--ink-soft);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const BOUTIQUE="https://www.yourmood.net/products/";
const $=s=>document.querySelector(s);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PILE=[];            // le chemin parcouru : [{n, titre}]
function profondeurMax(){let m=0;(function w(n,p){n.pack?m=Math.max(m,p):n.opts.forEach(o=>w(o,p+1));})({opts:Object.values(TREE)},0);return m;}
const MAXQ=profondeurMax();
function jauge(n){$('#jauge').innerHTML=Array.from({length:MAXQ},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('');}
function intro(){
  PILE=[]; jauge(0);
  $('#scene').innerHTML=`<div class="carte" style="text-align:center">
    <p class="question">Quelques questions, et on sait lequel est pour toi.</p>
    <p class="aide">Pas de bonne réponse — juste la tienne.</p>
    <div style="margin-top:22px"><button class="cta" type="button" data-go="1">Commencer</button></div></div>`;
}
function q1(){
  PILE=[]; jauge(1);
  $('#scene').innerHTML=`<div class="carte"><span class="etape">Question 1</span>
    <p class="question">Tu vas vers quelles couleurs ?</p>
    <p class="aide">Celle qui te vient en premier est la bonne.</p>
    <div class="choix tuiles">${Object.entries(TREE).map(([k,f])=>
      FAMIMG[k]
        ? `<button type="button" data-k="${k}"><img src="${FAMIMG[k]}" alt="${esc(f.t)}"><span class="invisible">${esc(f.t)}</span></button>`
        : `<button type="button" data-k="${k}"><span class="em">${f.em}</span><span class="lib">${esc(f.t)}</span></button>`).join('')}</div>
    <div class="barre"><button class="lien" type="button" data-go="0">← revenir</button></div></div>`;
}
function etape(){
  const cur=PILE[PILE.length-1];
  if(!cur) return q1();
  if(cur.n.pack) return demanderMail(cur.n.pack);
  jauge(PILE.length+1);
  $('#scene').innerHTML=`<div class="carte"><span class="etape">Question ${PILE.length+1}</span>
    <p class="question">${esc(cur.n.q)}</p>
    <div class="choix">${cur.n.opts.map((o,i)=>
      `<button type="button" data-i="${i}"><span class="em">${o.em||'◦'}</span><span class="lib">${esc(o.t)}</span></button>`).join('')}</div>
    <div class="barre"><button class="lien" type="button" data-back="1">← revenir</button>
      <span class="fil">${PILE.map(x=>esc(x.titre)).join(' · ')}</span></div></div>`;
}
function demanderMail(cle){
  const p=PACKS[cle];
  $('#scene').innerHTML=`<div class="carte">
    <span class="etape">Dernière étape</span>
    <p class="question">On t'envoie ton résultat ?</p>
    <p class="aide">Ton pack s'affiche juste après, et tu le retrouves dans ta boîte mail.</p>
    <input class="champ" id="mail" type="email" inputmode="email" autocomplete="email"
      placeholder="ton adresse e-mail" aria-label="ton adresse e-mail">
    <p class="err" id="mailerr" style="display:none"></p>
    <div style="margin-top:18px"><button class="cta" type="button" id="mailok">Voir mon pack</button></div>
    <p class="rgpd">On s'en sert pour t'envoyer ton résultat et nos nouveautés. Tu peux te désinscrire quand tu veux.</p>
    <div class="barre"><button class="lien" type="button" data-back="1">← revenir</button></div></div>`;
  const champ=$('#mail'); setTimeout(()=>champ&&champ.focus(),80);
  champ.addEventListener('keydown',e=>{if(e.key==='Enter')$('#mailok').click();});
  $('#mailok').addEventListener('click',async()=>{
    const v=(champ.value||'').trim(), err=$('#mailerr'), b=$('#mailok');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)){
      err.textContent="Cette adresse n'a pas l'air complète — vérifie-la."; err.style.display=''; champ.focus(); return; }
    err.style.display='none'; b.disabled=true; b.textContent='Un instant…';
    try{ await fetch('/api/quiz-garde-mood-lead',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email:v,pack:p.t})}); }catch{}
    suspense(cle);
  });
}
function suspense(cle){
  const noms=Object.values(PACKS).map(p=>p.t);
  $('#scene').innerHTML=`<div class="carte"><span class="etape">On cherche le tien…</span>
    <div class="roul" id="roul">…</div></div>`;
  const r=$('#roul'); let n=0;
  const iv=setInterval(()=>{r.textContent=noms[(Math.random()*noms.length)|0]; if(++n>13){clearInterval(iv);resultat(cle);}},90);
}
function resultat(cle){
  const p=PACKS[cle];
  $('#scene').innerHTML=`<div class="carte reveal">
    <span class="etape">Ton garde-mood</span>
    <img class="photo" src="${esc(p.img)}" alt="${esc(p.t)}" loading="eager">
    <h2>${esc(p.t)}</h2>
    <p class="prix">${esc(p.prix)}.–</p>
    <div style="margin-top:18px"><a class="cta" href="${BOUTIQUE}${esc(p.h)}" target="_blank" rel="noopener">Voir le pack</a></div>
    <div class="cadeau">Et pour te lancer : <b>30.– offerts</b> sur ta garde-mood.</div>
    <div class="barre"><button class="lien" type="button" data-back="1">← revenir</button>
      <button class="lien" type="button" data-go="1">recommencer</button>
      <span class="fil">${PILE.map(x=>esc(x.titre)).join(' · ')}</span></div></div>`;
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');
  if(g){ (g.getAttribute('data-go')==='0'?intro:q1)(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const k=e.target.closest('[data-k]');
  if(k){ const c=k.getAttribute('data-k'); PILE=[{n:TREE[c],titre:TREE[c].t}]; etape(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const i=e.target.closest('[data-i]');
  if(i){ const cur=PILE[PILE.length-1], o=cur.n.opts[+i.getAttribute('data-i')];
    PILE.push({n:o,titre:o.t}); etape(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  const b=e.target.closest('[data-back]');
  if(b){ PILE.pop(); PILE.length?etape():q1(); window.scrollTo({top:0,behavior:'smooth'}); return; }
});
intro();
</script>
